<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SourceLab hexagon S mark">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ffff"/>
      <stop offset=".22" stop-color="#00eaff"/>
      <stop offset=".58" stop-color="#087dff"/>
      <stop offset="1" stop-color="#00f5ff"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#061d39"/>
      <stop offset=".5" stop-color="#020b19"/>
      <stop offset="1" stop-color="#031a2d"/>
    </linearGradient>
    <linearGradient id="letter" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".48" stop-color="#a9faff"/>
      <stop offset="1" stop-color="#16cfff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
  </defs>
  <!-- transparent canvas; emblem only -->
  <polygon points="256,35 448,145 448,367 256,477 64,367 64,145" fill="none" stroke="#00dfff" stroke-width="24" opacity=".28" filter="url(#softGlow)"/>
  <polygon points="256,35 448,145 448,367 256,477 64,367 64,145" fill="url(#face)" stroke="url(#edge)" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="256,57 429,156 429,356 256,455 83,356 83,156" fill="none" stroke="#13cfff" stroke-width="2.5" opacity=".72"/>
  <path d="M83 156 L256 57 L429 156" fill="none" stroke="#e7ffff" stroke-width="3" opacity=".8"/>
  <path d="M83 356 L256 455 L429 356" fill="none" stroke="#00eaff" stroke-width="3" opacity=".75"/>
  <!-- restrained circuit traces -->
  <g fill="none" stroke="#00cfff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".72">
    <path d="M112 210 V178 H146 L174 150"/><path d="M112 235 V260 H145 L166 281"/>
    <path d="M400 210 V178 H366 L338 150"/><path d="M400 235 V260 H367 L346 281"/>
    <path d="M112 302 V330 H150 L174 354"/><path d="M400 302 V330 H362 L338 354"/>
  </g>
  <g fill="#b9fbff" stroke="#00dfff" stroke-width="2" filter="url(#glow)">
    <circle cx="146" cy="178" r="4"/><circle cx="145" cy="260" r="4"/><circle cx="366" cy="178" r="4"/><circle cx="367" cy="260" r="4"/>
  </g>
  <text x="256" y="337" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="270" font-weight="800" letter-spacing="-18" fill="url(#letter)" stroke="#d9ffff" stroke-width="2" paint-order="stroke fill" filter="url(#glow)">S</text>
</svg>
